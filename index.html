<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background-color: #6f4c3e;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        .menu-item {
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 10px;
            width: 30%;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #6f4c3e;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Coffee Shop</h1>
    </header>
    <div class="menu">
        <div class="menu-item">
            <h2>Espresso</h2>
            <p><strong>$2.00</strong></p>
        </div>
        <div class="menu-item">
            <h2>Latte</h2>
            <p><strong>$3.50</strong></p>
        </div>
        <div class="menu-item">
            <h2>Cappuccino</h2>
            <p><strong>$3.00</strong></p>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Coffee Shop. All rights reserved.</p>
    </footer>
</body>
</html>
